<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />

  <!-- Synchronous anti-FOUC Theme Initialization -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add(theme);
      } catch (e) { }
    })();
  </script>

  <!-- Primary Meta Tags -->
  <title>Kathiravan S P | Software Developer Portfolio</title>
  <meta name="title" content="Kathiravan S P | Premium Developer Portfolio" />
  <meta name="description"
    content="Portfolio of Kathiravan S P - Full Stack Developer & AI Application Engineer. Building scalable web systems, machine learning utilities, and sleek user-focused SaaS experiences." />
  <meta name="keywords"
    content="Kathiravan S P, Kathiravan, Portfolio, Full Stack Developer, AI Engineer, Machine Learning, Django, Python, React, MongoDB, Sri Eshwar College of Engineering" />
  <meta name="author" content="Kathiravan S P" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kathiravan S P | Premium Developer Portfolio" />
  <meta property="og:description"
    content="Full Stack Developer & AI Application Engineer building scalable web applications and intelligent solutions." />
  <meta property="og:image" content="/profile.jpg" />
  <meta property="og:site_name" content="Kathiravan S P Portfolio" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kathiravan S P | Premium Developer Portfolio" />
  <meta name="twitter:description"
    content="Full Stack Developer & AI Application Engineer building scalable web applications and intelligent solutions." />
  <meta name="twitter:image" content="/profile.jpg" />

  <!-- Google Font Preconnect Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
